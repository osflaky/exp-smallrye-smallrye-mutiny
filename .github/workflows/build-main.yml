name: Main branch continuous integration
on:
  workflow_dispatch:
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: Test the main branch [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6   # v6.0.1
      with:
        java-version: 21
        distribution: temurin
        cache: maven
    - name: Run the tests
      run: ./mvnw --no-transfer-progress -s .build/maven-ci-settings.xml -B 
        clean verify
    timeout-minutes: 150
